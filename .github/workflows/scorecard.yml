name: OpenSSF Scorecard

# Rates the repository's security practices (branch protection, token permissions, pinned
# dependencies, SAST and so on) with OpenSSF Scorecard. The results go to Code Scanning (Security
# tab) as SARIF and are published on scorecard.dev, the source of the README badge. With
# publish_results, the job may only use the actions used here and may not contain further steps.

on:
  push:
    branches: [main]
  # Branch protection rules change without a push, so also run weekly
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-26.04
    permissions:
      security-events: write # upload SARIF to Code Scanning
      id-token: write # publish results on scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
