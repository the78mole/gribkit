# Reference template - tested and debugged in the hoermoles-ble repo
# (github.com/the78mole/hoermoles-ble, .github/workflows/pypi-publish.yml).
# Copy this file, then replace every <PLACEHOLDER> and adjust the package
# list in build/publish jobs to match the target repo.
#
# For a single-package repo: delete the "-cli" job pair (build-cli,
# publish-cli-to-pypi) and its `needs`/summary references, keep one
# build+publish pair.
#
# For a uv workspace with N packages published independently: duplicate the
# build-<pkg>/publish-<pkg>-to-pypi job pair per package, all sharing the
# same `needs: [version]` and the same computed version/tag.
#
# IMPORTANT: this filename ("pypi-publish.yml") must be exactly what's
# configured in PyPI's Trusted Publisher settings for EVERY package
# published from this file, for EVERY package (one Trusted Publisher entry
# per PyPI project, all pointing at this same repo+workflow+environment).
# See the "Publishing workflows - the reusable-workflow trap" section in the
# repo-ci-standards skill for why this must NOT be split into a
# separately-`uses:`-called reusable workflow.

name: Create Release and Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - '<PACKAGE_ROOT>/**'          # e.g. 'python/**' - scope to this component in a monorepo
      - '.github/workflows/*.yml'
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pypi-only
          - none

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}

    steps:
    - uses: actions/checkout@v7          # check latest - see repo-ci-standards section 3
      with:
        fetch-depth: 0

    - name: Calculate semantic version
      id: semver
      uses: paulhatch/semantic-version@v6.0.3   # check latest
      with:
        tag_prefix: "<TAG_PREFIX>"       # e.g. "v" for a single-component repo, "python/v" in a monorepo
        major_pattern: "/(feat|fix|refactor)!:/"
        minor_pattern: "/^feat:/"
        version_format: "${major}.${minor}.${patch}"
        bump_each_commit: true           # every commit to main bumps patch - confirm this is wanted
        search_commit_body: true

    - name: Show version
      run: |
        echo "Version: ${{ steps.semver.outputs.version }}"
        echo "Version Tag: ${{ steps.semver.outputs.version_tag }}"
        cat >> $GITHUB_STEP_SUMMARY <<EOF
        ## 📦 Neue Version berechnet

        **Version:** \`${{ steps.semver.outputs.version }}\`
        **Git-Tag:** \`${{ steps.semver.outputs.version_tag }}\`
        EOF

  create-release:
    name: Create GitHub Release
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ needs.version.outputs.version_tag }} \
          --title "<PROJECT_NAME> ${{ needs.version.outputs.version }}" \
          --notes "## <PROJECT_NAME> ${{ needs.version.outputs.version }}

        <ONE-LINE PROJECT DESCRIPTION>

        ### Installation

        \`\`\`bash
        pip install <PACKAGE_NAME>==${{ needs.version.outputs.version }}
        \`\`\`
        " \
          --latest

        cat >> $GITHUB_STEP_SUMMARY <<EOF
        ## 🏷️ GitHub Release erstellt

        **Release:** [${{ needs.version.outputs.version_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version_tag }})
        EOF

  # --- one build/publish pair per PyPI package - duplicate this block for each ---

  build-lib:
    name: Build <PACKAGE_NAME> distribution
    needs: [version]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.publish_target == 'all' || github.event.inputs.publish_target == 'pypi-only'))
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Set package version
      # GOTCHA (verified locally, don't re-litigate): if pyproject.toml has a
      # plain static `version = "..."` under [project] (no hatch-vcs/dynamic
      # versioning), `hatch version <x>` REFUSES to touch it: "Cannot set
      # version when it is statically defined by the project.version field".
      # Rewrite the line directly instead of fighting hatch about it - unless
      # the project already uses hatch-vcs/dynamic versioning, in which case
      # use `SETUPTOOLS_SCM_PRETEND_VERSION` instead of this step.
      working-directory: <PACKAGE_DIR>   # e.g. python/packages/<name>
      run: |
        python3 -c "
        import re, pathlib
        path = pathlib.Path('pyproject.toml')
        text = path.read_text()
        new_text, count = re.subn(r'(?m)^version = \"[^\"]*\"', 'version = \"${{ needs.version.outputs.version }}\"', text, count=1)
        assert count == 1, 'expected exactly one version = \"...\" line in [project]'
        path.write_text(new_text)
        "
        grep '^version = ' pyproject.toml

    - name: Build package
      working-directory: <PACKAGE_DIR>
      run: python -m build

    - name: Check distribution
      working-directory: <PACKAGE_DIR>
      run: |
        twine check dist/*
        cat >> $GITHUB_STEP_SUMMARY <<EOF
        ## 🔨 <PACKAGE_NAME> Build

        **Version:** \`${{ needs.version.outputs.version }}\`
        \`\`\`
        $(ls -lh dist/)
        \`\`\`
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: <PACKAGE_NAME>-dist        # must be unique per package in a multi-package repo
        path: <PACKAGE_DIR>/dist/

  publish-lib-to-pypi:
    name: Publish <PACKAGE_NAME> to PyPI
    needs: [version, build-lib]
    runs-on: ubuntu-latest

    environment:
      name: pypi          # must match the "Environment name" in PyPI's Trusted Publisher config
      url: https://pypi.org/p/<PACKAGE_NAME>

    permissions:
      id-token: write     # required for OIDC Trusted Publishing - no API token/secret needed

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: <PACKAGE_NAME>-dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Add PyPI Summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY <<EOF
        ## 🚀 <PACKAGE_NAME> PyPI Veröffentlichung

        **Package:** [<PACKAGE_NAME>](https://pypi.org/project/<PACKAGE_NAME>/)
        **Version:** \`${{ needs.version.outputs.version }}\`
        EOF

  # --- repeat build-<x>/publish-<x>-to-pypi for additional packages, then: ---

  summary:
    name: Release Summary
    needs: [version, create-release, build-lib, publish-lib-to-pypi]   # add more package jobs here
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Create Summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY <<EOF
        ## 🎉 Release Workflow Abgeschlossen

        **Version:** \`${{ needs.version.outputs.version }}\`
        **Git Tag:** \`${{ needs.version.outputs.version_tag }}\`

        ### Status

        - GitHub Release: ${{ needs.create-release.result == 'success' && '✅' || '❌' }}
        - PyPI Publish: ${{ needs.publish-lib-to-pypi.result == 'success' && '✅' || needs.publish-lib-to-pypi.result == 'skipped' && '⏭️' || '❌' }}
        EOF
