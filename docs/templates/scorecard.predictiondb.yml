name: OpenSSF Scorecard

# Rates the repository's security practices (branch protection, token permissions,
# pinned dependencies, SAST and so on) with OpenSSF Scorecard. The results go to
# Code Scanning (Security tab) as SARIF and are published on scorecard.dev, the
# source of the README badge and the project page score. With publish_results, the
# job may only use the actions used here and may not contain any further steps.

on:
  push:
    branches: [main]
  # Branch protection rules change without a push, so also run weekly
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-26.04
    permissions:
      security-events: write  # upload SARIF to Code Scanning
      id-token: write         # publish results on scorecard.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
