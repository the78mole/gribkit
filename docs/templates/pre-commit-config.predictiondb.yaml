# pre-commit: the same checks as the CI job "Lint and types".
# All hooks run locally through uv with the versions from uv.lock (no separate
# rev per hook), so the same Ruff and mypy versions check locally and in CI.
# Requirement: uv sync --all-packages (mypy needs all packages).
#
#   uv run pre-commit install           # set up the hook in .git/hooks
#   uv run pre-commit run --all-files   # check everything, like CI
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # Always checks the whole project (files in pyproject.toml), because
        # type errors can also arise in unchanged files.
        entry: uv run --no-sync mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: mypy-analysen
        name: mypy (analysis scripts, each folder separately)
        # All scripts are named auswertung.py and are therefore checked one by one.
        entry: bash -c 'for f in docs/analysen/*/auswertung.py; do uv run --no-sync mypy "$f" || exit 1; done'
        language: system
        files: ^docs/analysen/.*\.py$
        pass_filenames: false
        require_serial: true
      - id: strictdoc
        name: strictdoc (requirements and @relation markers)
        # Exports reqs/ to build/reqs/html. Fails on unknown IDs in relations
        # or @relation markers.
        entry: uv run --no-sync strictdoc export reqs --output-dir build/reqs
        language: system
        files: ^(reqs/.*|.*\.py)$
        pass_filenames: false
        require_serial: true
      - id: reqs-coverage
        name: Coverage of the software requirements
        entry: uv run --no-sync python reqs/pruefen.py
        language: system
        files: ^(reqs/.*|.*\.py)$
        pass_filenames: false
        require_serial: true
