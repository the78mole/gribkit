# CodeRabbit: automatic reviews for pull requests.
# Schema: https://docs.coderabbit.ai/reference/configuration
#
# CodeRabbit only gives hints. It sets no commit status and is not a required
# check, so that Renovate's automerge never waits for a review (because of
# platformAutomerge=false, Renovate checks all checks itself).
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >-
  Factual and concise. Only hints of real value: bugs, data loss, license
  violations, security holes, missing tests. No style criticism that ruff or
  mypy already cover.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  # No commit status, otherwise Renovate automerges wait for it.
  commit_status: false
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  poem: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    # Do not review Renovate PRs: they are merged automatically when checks
    # pass, a review adds nothing there.
    ignore_usernames:
      - renovate[bot]
      - renovate
    ignore_title_keywords:
      - "chore(deps)"

  path_filters:
    - "!uv.lock"
    - "!**/uv.lock"
    # Results of the analysis scripts (figures, tables, PDFs) are generated.
    - "!docs/analysen/**/grafiken/**"
    - "!docs/analysen/**/tabellen/**"
    - "!**/*.pdf"
    - "!**/*.png"
    - "!**/*.csv"
    - "!**/*.parquet"
    - "!**/*.grib2"
    - "!services/**/tests/fixtures/**"

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Python 3.14 in the uv workspace. ruff (lint and format) and mypy run
        through pre-commit and in CI; do not comment on formatting and import
        order. Watch for types on public functions, time zones (timestamps
        always timezone-aware, UTC in the database), units (MW/MWh, EUR/MWh)
        and robust retries on HTTP requests. Docstrings and comments are in
        English.
    - path: "services/energy_ingest/src/energy_ingest/sources/**"
      instructions: |
        Data sources. Guiding principle: models and data are published openly
        and freely. For new or changed sources, check:
        - Fully automatic retrieval through an API, no parsing of PDFs or HTML
          pages, no manually maintained CSV files.
        - If the license is free (or expressly allows non-commercial use), the
          source runs without a switch. Non-free series may only run behind a
          PDB_ALLOW_* switch (default false); a missing switch is an error.
        - License and origin of the series are stated in the module docstring.
    - path: "services/energy_ingest/src/energy_ingest/config.py"
      instructions: |
        New PDB_ALLOW_* switches must default to false and appear in
        .env.example and docs/DATENQUELLEN-ZUGANG.md.
    - path: "migrations/versions/**"
      instructions: |
        Alembic migrations. Check that downgrade() reverses the change, large
        tables are not rewritten unnecessarily and indexes match the queries.
        Do not change migrations that are already merged.
    - path: "config/grafana/dashboards/**/*.json"
      instructions: |
        Provisioned Grafana dashboards. Check only the SQL queries (time filter
        $__timeFilter, time zones, units) and the panel units. Do not comment
        on layout coordinates (gridPos), ids and version fields.
    - path: "docs/analysen/*/auswertung.py"
      instructions: |
        Analysis scripts that generate figures and tables in the same folder.
        Check traceability and whether the statements in the folder's README
        match the computed numbers.
    - path: "**/*.md"
      instructions: |
        Documentation in English. Check consistency with the code (names of
        environment variables, services, commands), not style or spelling. Do
        not reintroduce the name of the legacy system.
    - path: "{compose.yaml,compose.override.yaml,predict/compose.yaml}"
      instructions: |
        Docker Compose for a VM on Proxmox. Secrets only through .env, no
        plain-text passwords. Images with a fixed tag.
    - path: ".github/workflows/**"
      instructions: |
        Actions with fixed versions, minimal permissions per job. Releases run
        through Conventional Commits.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        Conventional Commit: type(scope): description, type one of feat, fix,
        docs, chore, refactor, test, ci, build, perf. Description in English,
        starting in lower case, without a period at the end.
    description:
      mode: "off"

  tools:
    ruff:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
